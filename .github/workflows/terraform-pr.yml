name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-pr.yml"
      - ".github/workflows/terraform-production.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Format check
        run: terraform -chdir=infra fmt -check -diff -recursive
      - name: Initialize providers without backend
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform -chdir=infra validate -no-color
