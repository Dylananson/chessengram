name: Terraform production

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build Worker artifact
        run: npm ci && npm run build:worker
      - name: Initialize production backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: >-
          terraform -chdir=infra init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=chessengram/prod/terraform.tfstate"
          -backend-config="region=${TF_STATE_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Create reviewable production plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_workers_dev_subdomain: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          TF_VAR_app_url: https://chessreps-prod.pages.dev
          TF_VAR_pages_project_name: chessengram
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: terraform -chdir=infra plan -input=false -no-color -out=../production.tfplan
      - name: Render plan summary
        run: terraform -chdir=infra show -no-color ../production.tfplan > production-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-plan-${{ github.sha }}
          path: |
            production.tfplan
            production-plan.txt
          if-no-files-found: error
          retention-days: 14

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-plan-${{ github.sha }}
      - name: Build Worker artifact
        run: npm ci && npm run build:worker
      - name: Initialize production backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: >-
          terraform -chdir=infra init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=chessengram/prod/terraform.tfstate"
          -backend-config="region=${TF_STATE_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Apply reviewed plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_workers_dev_subdomain: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          TF_VAR_app_url: https://chessreps-prod.pages.dev
          TF_VAR_pages_project_name: chessengram
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: terraform -chdir=infra apply -input=false -no-color ../production.tfplan
