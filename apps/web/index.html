<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23007bff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='navy,Segoe UI,sans-serif'%3ECR%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChessReps" />
    <title>ChessReps</title>
  </head>
  <body>
    <div id="promotion" class="promotion hidden" role="dialog" aria-modal="true" aria-labelledby="promotion-title" data-i18n-title="promotion.title">
      <div class="promotion-inner">
        <p id="promotion-title" class="promotion-title" data-i18n="promotion.title">Choose a promotion piece</p>
        <div class="promotion-choices cg-wrap">
          <button data-promotion="q" type="button" aria-label="Promote to queen"><piece class="white queen"></piece></button>
          <button data-promotion="r" type="button" aria-label="Promote to rook"><piece class="white rook"></piece></button>
          <button data-promotion="b" type="button" aria-label="Promote to bishop"><piece class="white bishop"></piece></button>
          <button data-promotion="n" type="button" aria-label="Promote to knight"><piece class="white knight"></piece></button>
        </div>
        <button class="promotion-cancel" data-promotion-cancel type="button" data-i18n="promotion.cancel">Cancel</button>
      </div>
    </div>
    <div class="container">
      <div class="app-header">
        <header>
          <h1 data-i18n="app.title">ChessReps</h1>
          <p class="subtitle" data-i18n="app.subtitle"></p>
        </header>
        <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      </div>
      <main id="screen" class="screen"></main>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
