<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>ChessReps</title>
  </head>
  <body>
    <div id="promotion" class="promotion hidden" role="dialog" aria-modal="true" data-i18n-title="promotion.title">
      <div class="promotion-inner">
        <button data-promotion="q" type="button"></button>
        <button data-promotion="r" type="button"></button>
        <button data-promotion="b" type="button"></button>
        <button data-promotion="n" type="button"></button>
      </div>
    </div>
    <div class="container">
      <h1 data-i18n="app.title">ChessReps Player</h1>
      <p class="subtitle" data-i18n="app.subtitle"></p>
      <div class="layout">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
        </div>
        <div class="controls">
          <div class="info">
            <h2 data-i18n="puzzle.info">Puzzle</h2>
            <p id="puzzle-id">-</p>
            <p id="rating">-</p>
            <p id="themes">-</p>
            <p id="solver-color">-</p>
          </div>
          <div class="info">
            <h2 data-i18n="status.title">Status</h2>
            <div id="status" class="status" data-i18n="status.loading">Loading…</div>
          </div>
          <div class="info">
            <h2 data-i18n="solution.title">Solution</h2>
            <div id="solution" class="solution-preview">-</div>
          </div>
          <button id="next-btn" class="button" type="button" disabled data-i18n="next.label">Next puzzle</button>
          <div>
            <p id="progress" class="progress-note"></p>
            <p id="storage" class="progress-note"></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
